<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Colaborativo com Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f7f5ef;
            color: #2b2a26;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #86c79a 0%, #6ab87a 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 10px;
            padding: 20px;
            border-bottom: 1px solid #e8e6e1;
            flex-wrap: wrap;
        }

        .controls input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #d4d0c5;
            border-radius: 6px;
            font-size: 14px;
        }

        .controls button {
            padding: 12px 24px;
            background: #86c79a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .controls button:hover {
            background: #6ab87a;
        }

        .status {
            padding: 10px 20px;
            font-size: 12px;
            background: #f0f0f0;
            border-bottom: 1px solid #e8e6e1;
        }

        .status.connected {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.disconnected {
            background: #ffebee;
            color: #c62828;
        }

        .items-container {
            max-height: 600px;
            overflow-y: auto;
            padding: 20px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #fafaf8;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #86c79a;
            transition: all 0.2s;
        }

        .item.completed {
            opacity: 0.6;
            background: #f0f0f0;
        }

        .item.completed .item-text {
            text-decoration: line-through;
            color: #888;
        }

        .item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #86c79a;
        }

        .item-text {
            flex: 1;
            padding: 0 10px;
        }

        .item-user {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            color: white
